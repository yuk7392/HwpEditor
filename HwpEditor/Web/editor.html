<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>HwpEditor</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>

<!-- 리본(엑셀 배치). ★ 바깥 상자는 id 가 hwMenu, 탭 내용 상자는 id 가 hwTools 그대로다 —
     hwBridge 는 hwMenu 에서 .hw-menu-item 을, hwUi 는 hwTools·hwQat 에서 data-* 단추를 위임으로 잡는다.
     겉모양만 바뀌었고 data-* 와 id 는 하나도 안 바꿨다(그 둘이 검사·동작의 계약이다).
     탭 구성은 FEATURE-DUMP 1-1 의 본 탭 5개(편집·보기·입력·서식·쪽) 그대로다. -->
<div id="hwMenu" class="hw-ribbon">

  <!-- 빠른 실행 도구 모음 + 제목. ★ 되돌리기·다시 실행이 여기로 왔다 — data-act 위임을
       hwUi 가 hwTools 말고 이 상자에도 걸어야 산다(hwUi.init). -->
  <div class="hw-rb-top" id="hwQat">
    <span class="hw-qat">
      <button class="hw-qat-btn hw-menu-item" data-cmd="save" title="저장 (Ctrl+S)">￬</button>
      <button class="hw-qat-btn hw-tool" data-act="undo" title="되돌리기 (Ctrl+Z)">↶</button>
      <button class="hw-qat-btn hw-tool" data-act="redo" title="다시 실행 (Ctrl+Shift+Z)">↷</button>
    </span>
    <span class="hw-rb-title" id="hwDocTitle">HwpEditor</span>
    <span class="hw-menu-gap"></span>
    <button class="hw-menu-item hw-rb-dev" id="hwBtnOracle">오라클</button>
    <button class="hw-menu-item hw-rb-dev" id="hwBtnPing">테스트</button>
  </div>

  <div class="hw-rb-tabs" id="hwRibbonTabs">
    <button class="hw-rb-tab on" data-rb="edit">편집</button>
    <button class="hw-rb-tab" data-rb="view">보기</button>
    <button class="hw-rb-tab" data-rb="insert">입력</button>
    <button class="hw-rb-tab" data-rb="format">서식</button>
    <button class="hw-rb-tab" data-rb="page">쪽</button>
  </div>

  <div id="hwTools" class="hw-rb-panes">

    <div class="hw-rb-pane on" data-rb="edit">
      <div class="hw-rb-group">
        <div class="hw-rb-body">
          <button class="hw-rb-big hw-menu-item" data-cmd="open" title="문서 열기 (Ctrl+O)">
            <span class="hw-rb-ico">🗁</span><span>열기</span>
          </button>
          <div class="hw-rb-rows">
            <div class="hw-rb-row">
              <button class="hw-menu-item" data-cmd="save">저장</button>
              <button class="hw-menu-item" data-cmd="saveAs">다른 이름으로</button>
            </div>
            <div class="hw-rb-row">
              <button class="hw-menu-item" data-cmd="pdf">PDF</button>
              <select id="hwRecent" class="hw-pick" title="최근 연 문서" disabled></select>
            </div>
          </div>
        </div>
        <span class="hw-rb-label">파일</span>
      </div>
      <div class="hw-rb-group">
        <div class="hw-rb-body">
          <button class="hw-rb-big hw-menu-item" data-cmd="find" title="찾기·바꾸기 (Ctrl+F)">
            <span class="hw-rb-ico">🔍</span><span>찾기</span>
          </button>
        </div>
        <span class="hw-rb-label">찾기</span>
      </div>
      <div class="hw-rb-group">
        <div class="hw-rb-body">
          <div class="hw-rb-rows">
            <div class="hw-rb-row"><button class="hw-menu-item" data-cmd="charShape" title="글자 모양 (Alt+L)">글자 모양</button></div>
            <div class="hw-rb-row"><button class="hw-menu-item" data-cmd="paraShape" title="문단 모양 (Alt+T)">문단 모양</button></div>
          </div>
        </div>
        <span class="hw-rb-label">모양</span>
      </div>
    </div>

    <div class="hw-rb-pane" data-rb="view">
      <div class="hw-rb-group">
        <div class="hw-rb-body">
          <button class="hw-rb-big hw-tool" data-zoom="100" title="100%">
            <span class="hw-rb-ico">⛶</span><span>100%</span>
          </button>
          <div class="hw-rb-rows">
            <div class="hw-rb-row"><button class="hw-tool" data-zoom="1" title="화면 확대">＋ 확대</button></div>
            <div class="hw-rb-row"><button class="hw-tool" data-zoom="-1" title="화면 축소">− 축소</button></div>
          </div>
        </div>
        <span class="hw-rb-label">확대/축소</span>
      </div>
      <div class="hw-rb-group">
        <div class="hw-rb-body">
          <div class="hw-rb-rows">
            <div class="hw-rb-row"><button class="hw-tool" data-zoom="width" title="폭 맞춤">폭 맞춤</button></div>
            <div class="hw-rb-row"><button class="hw-tool" data-zoom="page" title="쪽 맞춤">쪽 맞춤</button></div>
          </div>
        </div>
        <span class="hw-rb-label">맞춤</span>
      </div>
    </div>

    <div class="hw-rb-pane" data-rb="insert">
      <div class="hw-rb-group">
        <div class="hw-rb-body">
          <button class="hw-rb-big hw-menu-item" data-cmd="insertImage" title="그림 넣기">
            <span class="hw-rb-ico">🖼</span><span>그림</span>
          </button>
          <div class="hw-rb-rows">
            <div class="hw-rb-row"><button class="hw-menu-item" data-cmd="charMap" title="문자표 (Ctrl+F10)">문자표</button></div>
            <div class="hw-rb-row">
              <button class="hw-menu-item" data-cmd="hyperlink" title="하이퍼링크 (Ctrl+K,H)">하이퍼링크</button>
              <button class="hw-menu-item" data-cmd="bookmark" title="책갈피 (Ctrl+K,B)">책갈피</button>
            </div>
          </div>
        </div>
        <span class="hw-rb-label">넣기</span>
      </div>
      <div class="hw-rb-group">
        <div class="hw-rb-body">
          <button class="hw-rb-big hw-tool" data-tbl="newTable" title="표 만들기 (Ctrl+N,T)">
            <span class="hw-rb-ico">▦</span><span>표</span>
          </button>
          <div class="hw-rb-rows">
            <div class="hw-rb-row">
              <button class="hw-tool" data-tbl="addRow" title="아래에 행 넣기">행＋</button>
              <button class="hw-tool" data-tbl="delRow" title="이 행 지우기">행−</button>
              <button class="hw-tool" data-tbl="delTable" title="이 표 지우기">표−</button>
            </div>
            <div class="hw-rb-row">
              <button class="hw-tool" data-tbl="addCol" title="오른쪽에 열 넣기">열＋</button>
              <button class="hw-tool" data-tbl="delCol" title="이 열 지우기">열−</button>
            </div>
          </div>
        </div>
        <span class="hw-rb-label">표</span>
      </div>
      <div class="hw-rb-group">
        <div class="hw-rb-body">
          <div class="hw-rb-rows">
            <div class="hw-rb-row"><button class="hw-tool" data-obj="inline" title="고른 그림을 글자처럼 취급 / 어울림으로 바꾼다">글자처럼</button></div>
          </div>
        </div>
        <span class="hw-rb-label">개체</span>
      </div>
    </div>

    <div class="hw-rb-pane" data-rb="format">
      <div class="hw-rb-group">
        <div class="hw-rb-body">
          <div class="hw-rb-rows">
            <div class="hw-rb-row"><select id="hwStyle" class="hw-pick" title="스타일 (Ctrl+Alt+1~0)"></select></div>
          </div>
        </div>
        <span class="hw-rb-label">스타일</span>
      </div>
      <div class="hw-rb-group">
        <div class="hw-rb-body">
          <div class="hw-rb-rows">
            <div class="hw-rb-row">
              <select id="hwFont" class="hw-pick" title="글꼴"></select>
              <select id="hwSize" class="hw-pick hw-pick-sm" title="글자 크기"></select>
            </div>
            <div class="hw-rb-row">
              <button class="hw-tool" data-fmt="bold" title="굵게 (Ctrl+B)"><b>가</b></button>
              <button class="hw-tool" data-fmt="italic" title="기울임 (Ctrl+I)"><i>가</i></button>
              <button class="hw-tool" data-fmt="underline" title="밑줄 (Ctrl+U)"><u>가</u></button>
              <button class="hw-tool" data-fmt="strike" title="취소선"><s>가</s></button>
              <button class="hw-tool" data-fmt="sup" title="위첨자 (Alt+Shift+O)">가<sup>2</sup></button>
              <button class="hw-tool" data-fmt="sub" title="아래첨자 (Alt+Shift+S)">가<sub>2</sub></button>
              <input type="color" id="hwColor" class="hw-color" value="#000000" title="글자색">
              <input type="color" id="hwShade" class="hw-color" value="#FFFF00" title="형광펜">
              <button class="hw-tool" data-fmt="noShade" title="형광펜 없애기">형광펜×</button>
            </div>
          </div>
        </div>
        <span class="hw-rb-label">글꼴</span>
      </div>
      <div class="hw-rb-group">
        <div class="hw-rb-body">
          <div class="hw-rb-rows">
            <div class="hw-rb-row">
              <button class="hw-tool" data-align="left" title="왼쪽 정렬">◧</button>
              <button class="hw-tool" data-align="center" title="가운데 정렬">▣</button>
              <button class="hw-tool" data-align="right" title="오른쪽 정렬">◨</button>
              <button class="hw-tool" data-align="justify" title="양쪽 정렬">▤</button>
              <button class="hw-tool" data-align="distribute" title="배분 정렬">▥</button>
            </div>
            <div class="hw-rb-row">
              <button class="hw-tool" data-indent="-1" title="내어쓰기">◀</button>
              <button class="hw-tool" data-indent="1" title="들여쓰기">▶</button>
              <select id="hwLine" class="hw-pick hw-pick-sm" title="줄 간격"></select>
            </div>
          </div>
        </div>
        <span class="hw-rb-label">맞춤</span>
      </div>
      <div class="hw-rb-group">
        <div class="hw-rb-body">
          <div class="hw-rb-rows">
            <div class="hw-rb-row">
              <button class="hw-tool" data-head="bullet" title="글머리 기호 (Ctrl+Shift+Delete)">•─</button>
              <button class="hw-tool" data-head="number" title="문단 번호 (Ctrl+Shift+Insert)">1─</button>
            </div>
            <div class="hw-rb-row">
              <button class="hw-tool" data-lvl="1" title="목록 수준 내리기 (Ctrl+숫자판+)">≫</button>
              <button class="hw-tool" data-lvl="-1" title="목록 수준 올리기 (Ctrl+숫자판−)">≪</button>
            </div>
          </div>
        </div>
        <span class="hw-rb-label">목록</span>
      </div>
    </div>

    <div class="hw-rb-pane" data-rb="page">
      <div class="hw-rb-group">
        <div class="hw-rb-body">
          <button class="hw-rb-big hw-menu-item" data-cmd="pageSetup" title="페이지 설정 (F7)">
            <span class="hw-rb-ico">🗎</span><span>페이지 설정</span>
          </button>
        </div>
        <span class="hw-rb-label">쪽 모양</span>
      </div>
      <div class="hw-rb-group">
        <div class="hw-rb-body">
          <div class="hw-rb-rows">
            <div class="hw-rb-row">
              <button class="hw-menu-item" data-cmd="headInsert" title="머리말 넣기">머리말</button>
              <button class="hw-menu-item" data-cmd="footInsert" title="꼬리말 넣기">꼬리말</button>
            </div>
            <div class="hw-rb-row">
              <button class="hw-menu-item" data-cmd="pageNumber" title="쪽 번호 매기기">쪽 번호</button>
            </div>
          </div>
        </div>
        <span class="hw-rb-label">머리말·쪽 번호</span>
      </div>
    </div>

  </div>
</div>

<!-- 찾기·바꾸기. 도구줄 안에 두지 않는다 — 도구줄은 초점을 안 뺏으려고 mousedown 을 막는데
     찾기 칸은 반대로 초점을 받아야 한다. 흐름 밖으로 띄워 캔버스 높이도 안 건드린다. -->
<div id="hwFind" class="hw-find" hidden>
  <div class="hw-find-row">
    <input id="hwFindText" type="text" placeholder="찾을 내용" spellcheck="false">
    <button data-find="prev" title="이전 찾기 (Shift+Enter)">◀</button>
    <button data-find="next" title="다음 찾기 (Enter)">▶</button>
    <button data-find="close" title="닫기 (Esc)">✕</button>
  </div>
  <div class="hw-find-row" id="hwReplRow" hidden>
    <input id="hwReplText" type="text" placeholder="바꿀 내용" spellcheck="false">
    <button data-find="one">바꾸기</button>
    <button data-find="all">모두</button>
  </div>
  <div class="hw-find-row">
    <select id="hwFindDir" title="찾을 방향">
      <option value="all">문서 전체</option>
      <option value="down">아래쪽으로</option>
      <option value="up">위쪽으로</option>
    </select>
    <label><input id="hwFindCase" type="checkbox"> 대/소문자 구분</label>
    <label><input id="hwFindWidth" type="checkbox"> 전자/반자 구분</label>
  </div>
  <div class="hw-find-row">
    <label><input id="hwFindWord" type="checkbox"> 단어 단위로</label>
    <label><input id="hwFindPunct" type="checkbox"> 문장 부호 무시</label>
    <label><input id="hwFindSpace" type="checkbox"> 공백 무시</label>
  </div>
  <div class="hw-find-row">
    <button data-find="mark">모두 강조 표시</button>
    <button data-find="unmark">강조 표시 지우기</button>
    <span id="hwFindInfo" class="hw-find-info"></span>
  </div>
</div>

<!-- 찾아가기(Alt+G). 찾기 창과 같은 층이다 — 초점을 받아야 하고 캔버스 높이를 안 건드린다.
     ★ window.prompt 로 묻지 않는다. WebView2 에서는 네이티브 모달이라 창 전체가 멈춘다. -->
<div id="hwGoto" class="hw-find" hidden>
  <div class="hw-find-row">
    <label>쪽 <input id="hwGotoPage" type="number" min="1" step="1"></label>
    <label>책갈피 <select id="hwGotoMark" class="hw-pick hw-pick-sm"></select></label>
    <button data-goto="go">이동</button>
    <button data-goto="close" title="닫기 (Esc)">✕</button>
    <span id="hwGotoInfo" class="hw-find-info"></span>
  </div>
</div>

<div id="hwCanvas" class="hw-canvas">
  <!-- 문서를 열기 전에는 빈 A4 한 쪽. 문서가 오면 hwRender 가 통째로 다시 채운다. -->
  <div class="hw-page" id="hwPage0"></div>
</div>

<!-- IME 수신기. 본문은 contenteditable 이 아니고 이 상자 하나가 글자와 조합을 받는다.
     ★ 화면 밖으로 밀어 두지 않는다 — 캐럿 옆에 있어야 한글 후보 창이 문서 위에 뜬다.
       대신 1픽셀 크기에 투명이라 눈에는 안 보인다. -->
<div id="hwIme" contenteditable="true" spellcheck="false" autocorrect="off" autocapitalize="off"></div>

<!-- ★ #hwStatus 는 글자만 담는 요소로 둔다 — hwSetStatus·hwSelfTest·검사가 그 textContent 를 통째로 쓰고 읽는다. -->
<div id="hwStatusBar" class="hw-statusbar">
  <div id="hwStatus" class="hw-status">시작 중…</div>
  <div class="hw-nav">
    <button data-nav="first" title="처음 쪽">|◀</button>
    <button data-nav="prev" title="이전 쪽">◀</button>
    <span id="hwPageNo" class="hw-pageno">-</span>
    <button data-nav="next" title="다음 쪽">▶</button>
    <button data-nav="last" title="마지막 쪽">▶|</button>
    <span class="hw-bar"></span>
    <select id="hwZoomPick" title="확대 비율">
      <option value="400">400%</option>
      <option value="200">200%</option>
      <option value="100">100%</option>
      <option value="75">75%</option>
      <option value="66">66%</option>
      <option value="50">50%</option>
      <option value="33">33%</option>
      <option value="25">25%</option>
      <option value="width">폭 맞춤</option>
      <option value="page">쪽 맞춤</option>
    </select>
    <button data-zoom="-1" title="축소 (Shift+숫자판 −)">−</button>
    <input id="hwZoomSlider" type="range" min="25" max="400" step="1" value="100" title="확대 비율">
    <button data-zoom="1" title="확대 (Shift+숫자판 +)">+</button>
  </div>
</div>

<script src="hwUnit.js"></script>
<script src="hwModel.js"></script>
<script src="hwMeasure.js"></script>
<script src="hwHead.js"></script>
<script src="hwLink.js"></script>
<script src="hwBreak.js"></script>
<script src="hwTable.js"></script>
<script src="hwPage.js"></script>
<script src="hwRender.js"></script>
<script src="hwCaret.js"></script>
<script src="hwObj.js"></script>
<script src="hwUndo.js"></script>
<script src="hwFormat.js"></script>
<script src="hwInput.js"></script>
<script src="hwFind.js"></script>
<script src="hwDialog.js"></script>
<script src="hwUi.js"></script>
<script src="hwOracle.js"></script>
<script src="hwBridge.js"></script>
</body>
</html>

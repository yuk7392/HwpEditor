<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>HwpEditor</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>

<div id="hwMenu" class="hw-menu">
  <button class="hw-menu-item" data-cmd="open">열기</button>
  <select id="hwRecent" class="hw-pick" title="최근 연 문서" disabled></select>
  <button class="hw-menu-item" data-cmd="save">저장</button>
  <button class="hw-menu-item" data-cmd="saveAs">다른 이름으로</button>
  <button class="hw-menu-item" data-cmd="insertImage">그림</button>
  <button class="hw-menu-item" data-cmd="pdf">PDF</button>
  <button class="hw-menu-item" data-cmd="find">찾기</button>
  <span class="hw-menu-gap"></span>
  <button class="hw-menu-item" id="hwBtnOracle">오라클</button>
  <button class="hw-menu-item" id="hwBtnPing">테스트</button>
</div>

<!-- 서식 도구줄(4단계). 누를 때 캐럿 초점을 안 뺏는다 — hwUi 가 mousedown 을 막는다. -->
<div id="hwTools" class="hw-tools">
  <select id="hwFont" class="hw-pick" title="글꼴"></select>
  <select id="hwSize" class="hw-pick hw-pick-sm" title="글자 크기"></select>
  <button class="hw-tool" data-fmt="bold" title="굵게 (Ctrl+B)"><b>가</b></button>
  <button class="hw-tool" data-fmt="italic" title="기울임 (Ctrl+I)"><i>가</i></button>
  <button class="hw-tool" data-fmt="underline" title="밑줄 (Ctrl+U)"><u>가</u></button>
  <button class="hw-tool" data-fmt="strike" title="취소선"><s>가</s></button>
  <input type="color" id="hwColor" class="hw-color" value="#000000" title="글자색">
  <span class="hw-bar"></span>
  <button class="hw-tool" data-align="left" title="왼쪽 정렬">◧</button>
  <button class="hw-tool" data-align="center" title="가운데 정렬">▣</button>
  <button class="hw-tool" data-align="right" title="오른쪽 정렬">◨</button>
  <button class="hw-tool" data-align="justify" title="양쪽 정렬">▤</button>
  <span class="hw-bar"></span>
  <button class="hw-tool" data-indent="-1" title="내어쓰기">◀</button>
  <button class="hw-tool" data-indent="1" title="들여쓰기">▶</button>
  <select id="hwLine" class="hw-pick hw-pick-sm" title="줄 간격"></select>
  <span class="hw-bar"></span>
  <button class="hw-tool" data-obj="inline" title="고른 그림을 글자처럼 취급 / 어울림으로 바꾼다">글자처럼</button>
  <span class="hw-bar"></span>
  <button class="hw-tool" data-tbl="addRow" title="아래에 행 넣기">행+</button>
  <button class="hw-tool" data-tbl="delRow" title="이 행 지우기">행−</button>
  <button class="hw-tool" data-tbl="addCol" title="오른쪽에 열 넣기">열+</button>
  <button class="hw-tool" data-tbl="delCol" title="이 열 지우기">열−</button>
</div>

<!-- 찾기·바꾸기(8단계). 도구줄 안에 두지 않는다 — 도구줄은 초점을 안 뺏으려고 mousedown 을 막는데
     찾기 칸은 반대로 초점을 받아야 한다. 흐름 밖으로 띄워 캔버스 높이도 안 건드린다. -->
<div id="hwFind" class="hw-find" hidden>
  <div class="hw-find-row">
    <input id="hwFindText" type="text" placeholder="찾을 내용" spellcheck="false">
    <button data-find="prev" title="이전 찾기 (Shift+Enter)">◀</button>
    <button data-find="next" title="다음 찾기 (Enter)">▶</button>
    <button data-find="close" title="닫기 (Esc)">✕</button>
  </div>
  <div class="hw-find-row" id="hwReplRow" hidden>
    <input id="hwReplText" type="text" placeholder="바꿀 내용" spellcheck="false">
    <button data-find="one">바꾸기</button>
    <button data-find="all">모두</button>
  </div>
  <div class="hw-find-row">
    <label><input id="hwFindCase" type="checkbox"> 대소문자 구분</label>
    <span id="hwFindInfo" class="hw-find-info"></span>
  </div>
</div>

<div id="hwCanvas" class="hw-canvas">
  <!-- 문서를 열기 전에는 빈 A4 한 쪽. 문서가 오면 hwRender 가 통째로 다시 채운다. -->
  <div class="hw-page" id="hwPage0"></div>
</div>

<!-- IME 수신기. 본문은 contenteditable 이 아니고 이 상자 하나가 글자와 조합을 받는다(계획 G-4).
     ★ 화면 밖으로 밀어 두지 않는다 — 캐럿 옆에 있어야 한글 후보 창이 문서 위에 뜬다.
       대신 1픽셀 크기에 투명이라 눈에는 안 보인다. -->
<div id="hwIme" contenteditable="true" spellcheck="false" autocorrect="off" autocapitalize="off"></div>

<div id="hwStatus" class="hw-status">시작 중…</div>

<script src="hwUnit.js"></script>
<script src="hwModel.js"></script>
<script src="hwMeasure.js"></script>
<script src="hwBreak.js"></script>
<script src="hwTable.js"></script>
<script src="hwPage.js"></script>
<script src="hwRender.js"></script>
<script src="hwCaret.js"></script>
<script src="hwObj.js"></script>
<script src="hwUndo.js"></script>
<script src="hwFormat.js"></script>
<script src="hwInput.js"></script>
<script src="hwFind.js"></script>
<script src="hwUi.js"></script>
<script src="hwOracle.js"></script>
<script src="hwBridge.js"></script>
</body>
</html>
